name: Worker CI/CD

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  # Runs the pipeline again for a branch (on dev and main it also publishes
  # and rolls out, as a push does).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================================================================
  # 🔍 LINT
  # ================================================================
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Check Black formatting
        run: poetry run black --check .

      - name: Check isort formatting
        run: poetry run isort --check-only .

      - name: Run MyPy
        run: poetry run mypy app/ --ignore-missing-imports
        continue-on-error: true

  # ================================================================
  # 🧪 TEST (unit) — no external dependencies
  # ================================================================
  test-unit:
    name: "🧪 Test (unit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run unit tests
        run: poetry run pytest -m unit -v
        env:
          CREDENTIAL_ENCRYPTION_KEY: "Q1PNlFd4It9oQPtjCcXcmB7wGDkY4w8KwpIRNSF4u7U="
          # Suffix the .coverage file so it can be merged in the
          # `coverage` job alongside the integration job's data.
          COVERAGE_FILE: .coverage.unit

      - name: Upload coverage data (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: coverage.xml
          retention-days: 7

  # ================================================================
  # 🧪 TEST (integration) — requires external services
  # ================================================================
  test-integration:
    name: "🧪 Test (integration)"
    runs-on: ubuntu-latest
    needs: [test-unit]

    # The task queue is a Postgres table (.github#5): the integration tests
    # build the worker's part of the schema (tests/schema.sql) and run a
    # real ``celery worker`` against it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run integration tests
        run: poetry run pytest -m integration -v || [ $? -eq 5 ]
        env:
          CREDENTIAL_ENCRYPTION_KEY: "Q1PNlFd4It9oQPtjCcXcmB7wGDkY4w8KwpIRNSF4u7U="
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/worker_test"
          # Suffix the .coverage file so it can be merged in the
          # `coverage` job alongside the unit job's data.
          COVERAGE_FILE: .coverage.integration

      - name: Upload coverage data (integration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  # ================================================================
  # 📊 COVERAGE — aggregate + gate
  # ================================================================
  # Combines the .coverage data from the unit and integration jobs,
  # renders an HTML report, emits a Shields.io endpoint badge.json, and
  # keeps both as a workflow artifact.
  #
  # Used to also publish to GitHub Pages; removed - Pages was never
  # actually enabled for this repo, the README badge pointed at the
  # pre-rename org and had never resolved either, and nothing else
  # depended on the published site. The HTML report is still available,
  # just as the coverage-html workflow artifact below.
  coverage:
    name: "📊 Coverage"
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: ${{ !cancelled() }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage data
        run: poetry run coverage combine

      - name: Render HTML report
        run: poetry run coverage html -d coverage-html

      - name: Render JSON report
        run: poetry run coverage json -o coverage-html/coverage.json

      - name: Generate Shields.io endpoint badge
        run: |
          PCT=$(python -c "import json; print(round(json.load(open('coverage-html/coverage.json'))['totals']['percent_covered'], 1))")
          COLOR=$(python -c "p=$PCT; print('brightgreen' if p>=80 else 'green' if p>=70 else 'yellow' if p>=50 else 'orange' if p>=30 else 'red')")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage-html/badge.json
          echo "Coverage: ${PCT}% (${COLOR})"

      - name: Upload HTML report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

      - name: Test Coverage Gate (enforce on main)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          MIN_COVERAGE=60.0
          PCT=$(python -c "import json; print(round(json.load(open('coverage-html/coverage.json'))['totals']['percent_covered'], 1))")
          echo "Current worker coverage: ${PCT}%, required minimum: ${MIN_COVERAGE}%"
          if (( $(echo "$PCT < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage Gate Failed: ${PCT}% is below required ${MIN_COVERAGE}%"
            exit 1
          fi
          echo "✅ Coverage Gate Passed: ${PCT}% >= ${MIN_COVERAGE}%"

  # ================================================================
  # 🔒 SECURITY (deps + filesystem) — blocks on HIGH/CRITICAL
  # ================================================================
  # Runs in parallel with lint/test-unit. Findings appear in the
  # GitHub Security tab via SARIF upload. Whitelist false positives
  # in `.trivyignore` (with a comment explaining why).
  security:
    name: "🔒 Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies (production only)
        run: poetry install --no-root --without dev

      - name: pip-audit (production deps, HIGH+)
        run: |
          poetry run python -m pip install --upgrade pip
          poetry run python -m pip install pip-audit
          poetry run pip-audit --strict

      # Trivy fs runs twice on purpose:
      #   1. blocking gate — fails the job on HIGH/CRITICAL
      #   2. SARIF emit — uploads ALL findings (incl. ignored ones)
      #      to the Security tab so they remain visible
      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

      - name: Trivy filesystem scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy fs results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ================================================================
  # 🐳 BUILD — always runs, proves Dockerfile works
  # ================================================================
  build:
    name: "🐳 Build"
    runs-on: ubuntu-latest
    needs: [lint, test-integration, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The pod deployer (.github#4): no git, OpenTofu or Packer, no root.
      - name: Build pod-deployer image
        uses: docker/build-push-action@v5
        with:
          # New per run: the upgrade step (Dockerfile, ARG SECURITY_REFRESH) never comes from the build cache.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          context: .
          file: ./Dockerfile
          target: pod-deployer
          push: false
          platforms: linux/amd64,linux/arm64
          # A local name: never pushed, and github.repository has capitals,
          # which an image reference may not.
          tags: worker-pods:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # 🔒 IMAGE SCAN — Trivy CVE scan against the built image
  # ================================================================
  # Builds a single-platform amd64 image with --load so the local
  # Docker daemon can hand it to Trivy. The build cache is shared
  # with the multi-platform `build` job (cache-from: type=gha) so
  # this is mostly a thin layer on top.
  image-scan:
    name: "🔒 Image Scan"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local pod-deployer image (amd64, --load)
        uses: docker/build-push-action@v5
        with:
          # New per run: the upgrade step (Dockerfile, ARG SECURITY_REFRESH) never comes from the build cache.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          context: .
          file: ./Dockerfile
          target: pod-deployer
          push: false
          load: true
          platforms: linux/amd64
          tags: worker-pods:scan
          cache-from: type=gha

      - name: Trivy pod-deployer image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: worker-pods:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

  # ================================================================
  # 📦 PUSH — on main and dev
  # ================================================================
  push:
    name: "📦 Push"
    runs-on: ubuntu-latest
    needs: [build, image-scan]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
      id-token: write       # sign the image's origin (Sigstore, keyless)
      attestations: write   # store that signature with GitHub
    outputs:
      digest-pods: ${{ steps.push-image-pods.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (pod deployer)
        id: meta-pods
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-pods
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push pod-deployer image
        id: push-image-pods
        uses: docker/build-push-action@v5
        with:
          # New per run: the upgrade step (Dockerfile, ARG SECURITY_REFRESH) never comes from the build cache.
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          context: .
          file: ./Dockerfile
          target: pod-deployer
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-pods.outputs.tags }}
          labels: ${{ steps.meta-pods.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Signs which repository, workflow, branch and commit built this digest (SLSA
      # build provenance, keyless); the deployment repo rolls out only images that
      # have it (.github/scripts/verify-image.sh there).
      - name: Attest the image's origin
        if: steps.push-image-pods.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dhbw-appstore-t3/worker-pods
          subject-digest: ${{ steps.push-image-pods.outputs.digest }}

  # ================================================================
  # ☸️ ROLL OUT ON KUBERNETES — dev -> staging, main -> prod
  # ================================================================
  # The deployment repo pins the image just pushed (tag sha-<commit>) by its
  # digest in k8s/images/<staging|prod>.yaml; Argo CD of that environment
  # follows (see k8s-bump.yml there: a self-merging PR on dev,
  # a PR on main that a person approves).
  k8s-rollout:
    name: "☸️ Roll out on k8s"
    runs-on: ubuntu-latest
    needs: [push]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      # A one-hour token of the GitHub App "DHBW AppStore deploy" (installed only
      # on the deployment repository, Actions: write), not a personal token.
      - name: Token for the deployment repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: DHBW-AppStore-T3
          repositories: deployment
          permission-actions: write
      - name: Pin the new image in the deployment repo
        run: |
          gh workflow run k8s-bump.yml --repo DHBW-AppStore-T3/deployment --ref "$GITHUB_REF_NAME" \
            -f component=worker-pods -f tag="sha-${GITHUB_SHA::7}" -f digest="$DIGEST_PODS"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST_PODS: ${{ needs.push.outputs.digest-pods }}
